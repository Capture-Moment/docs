<!--
  CaptureMoment Docs — AI chat widget (Material for MkDocs edition).
  Colors come from Material's CSS variables, so the widget follows the
  light/dark palette toggle automatically. IDs match assets/js/chat-ui.js.
-->

<style>
  /* ---- Floating action button (bottom-right) ---- */
  #chat-fab {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 20;                       /* below Material header (z=2 drawers are fine) */
    width: 3.25rem;
    height: 3.25rem;
    border-radius: 50%;
    border: none;
    background: var(--md-primary-fg-color);
    color: var(--md-primary-bg-color);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--md-shadow-z2);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  #chat-fab:hover {
    transform: scale(1.08);
    box-shadow: var(--md-shadow-z3);
    background: var(--md-accent-fg-color);
  }

  #chat-fab .icon-close { display: none; }
  #chat-fab.open .icon-chat { display: none; }
  #chat-fab.open .icon-close { display: block; }

  @keyframes chat-pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--md-primary-fg-color) 45%, transparent); }
    70%  { box-shadow: 0 0 0 14px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  #chat-fab:not(.open) { animation: chat-pulse 2.5s infinite; }

  /* ---- Panel ---- */
  #chat-panel {
    position: fixed;
    bottom: 5.5rem;
    right: 1.25rem;
    z-index: 20;
    width: min(23rem, calc(100vw - 2rem));
    height: min(34rem, calc(100vh - 8rem));
    background: var(--md-default-bg-color);
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 0.75rem;
    box-shadow: var(--md-shadow-z3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-origin: bottom right;
    transform: scale(0.94) translateY(12px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
  }
  #chat-panel.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  /* ---- Header ---- */
  #chat-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1.1rem;
    color: var(--md-primary-bg-color);
    background: var(--md-primary-fg-color);
  }
  #chat-avatar {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;
    background: color-mix(in srgb, var(--md-primary-bg-color) 20%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #chat-header h3 {
    margin: 0;
    font-weight: 600;
    font-size: 0.9rem;
    line-height: 1.25;
    font-family: var(--md-text-font-family, "Roboto", sans-serif);
  }
  #chat-header p {
    margin: 0.1rem 0 0;
    font-size: 0.72rem;
    color: color-mix(in srgb, var(--md-primary-bg-color) 80%, transparent);
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .status-dot {
    width: 0.45rem;
    height: 0.45rem;
    background: #4ade80;
    border-radius: 50%;
    animation: dot-blink 2s infinite;
  }
  @keyframes dot-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ---- Messages ---- */
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    background: var(--md-default-bg-color);
  }
  #chat-messages::-webkit-scrollbar { width: 8px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb {
    background: var(--md-default-fg-color--light);
    border-radius: 8px;
  }

  .chat-msg {
    max-width: 85%;
    padding: 0.65rem 0.9rem;
    border-radius: 1rem;
    font-size: 0.82rem;
    line-height: 1.55;
    font-family: var(--md-text-font-family, "Roboto", sans-serif);
    animation: msg-in 0.3s ease;
    overflow-wrap: anywhere;
  }
  .chat-msg.bot {
    align-self: flex-start;
    background: var(--md-code-bg-color);
    border: 1px solid var(--md-default-fg-color--lightest);
    color: var(--md-default-fg-color);
    border-bottom-left-radius: 0.3rem;
  }
  .chat-msg.user {
    align-self: flex-end;
    color: var(--md-primary-bg-color);
    background: var(--md-primary-fg-color);
    border-bottom-right-radius: 0.3rem;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }
  .chat-msg.streaming::after {
    content: "▍";
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Markdown content inside bubbles */
  .chat-msg p { margin: 0 0 0.4rem; }
  .chat-msg p:last-child,
  .chat-msg ul:last-child { margin-bottom: 0; }
  .chat-msg ul {
    margin: 0.25rem 0 0.5rem;
    padding-left: 1.15rem;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .chat-msg code {
    background: var(--md-default-fg-color--lightest);
    padding: 0.1rem 0.3rem;
    border-radius: 0.25rem;
    font-size: 0.85em;
    font-family: var(--md-code-font-family, "Roboto Mono", monospace);
  }
  .chat-msg.bot a {
    color: var(--md-accent-fg-color);
    font-weight: 500;
    text-decoration: underline;
  }

  /* ---- Typing indicator ---- */
  .typing-dots { display: inline-flex; gap: 0.3rem; padding: 0.2rem 0; }
  .typing-dots span {
    width: 0.4rem;
    height: 0.4rem;
    background: var(--md-default-fg-color--light);
    border-radius: 50%;
    animation: dot-bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot-bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  /* ---- Suggestion chips ---- */
  .chat-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chat-chip {
    padding: 0.35rem 0.8rem;
    border: 1px solid var(--md-default-fg-color--lighter);
    border-radius: 9999px;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--md-accent-fg-color);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--md-text-font-family, "Roboto", sans-serif);
  }
  .chat-chip:hover {
    background: color-mix(in srgb, var(--md-accent-fg-color) 12%, transparent);
    border-color: var(--md-accent-fg-color);
    transform: translateY(-1px);
  }

  /* ---- Input bar ---- */
  #chat-form {
    display: flex;
    gap: 0.5rem;
    padding: 0.7rem;
    border-top: 1px solid var(--md-default-fg-color--lightest);
    background: var(--md-default-bg-color);
  }
  #chat-input {
    flex: 1;
    padding: 0.6rem 1rem;
    border: 1px solid var(--md-default-fg-color--lighter);
    border-radius: 9999px;
    background: var(--md-code-bg-color);
    color: var(--md-default-fg-color);
    font-family: var(--md-text-font-family, "Roboto", sans-serif);
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #chat-input::placeholder { color: var(--md-default-fg-color--light); }
  #chat-input:focus { border-color: var(--md-accent-fg-color); }
  #chat-input:disabled { opacity: 0.6; color: var(--md-default-fg-color--light); }

  #chat-send {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    border: none;
    background: var(--md-primary-fg-color);
    color: var(--md-primary-bg-color);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, opacity 0.2s;
  }
  #chat-send:hover { transform: scale(1.05); }
  #chat-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* The badge is useless on the docs — hidden (chat-ui.js removes it on first open) */
  #chat-fab-badge { display: none; }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    #chat-fab:not(.open) { animation: none; }
    .chat-msg { animation: none; }
  }
</style>

<button id="chat-fab" type="button" aria-label="Open the AI chat">
  <svg class="icon-chat" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>
  <svg class="icon-close" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
</button>

<div id="chat-panel" aria-hidden="true">
  <div id="chat-header">
    <div id="chat-avatar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></svg>
    </div>
    <div>
      <h3>Docs Assistant</h3>
      <p><span class="status-dot"></span> Technical answers about CaptureMoment</p>
    </div>
  </div>
  <div id="chat-messages"></div>
  <form id="chat-form">
    <input type="text" id="chat-input" placeholder="Ask about the docs..." autocomplete="off" maxlength="1000">
    <button type="submit" id="chat-send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
    </button>
  </form>
</div>
